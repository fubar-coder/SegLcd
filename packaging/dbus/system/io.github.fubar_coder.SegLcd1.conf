<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy for seglcdd (system service).
  - the service user "seglcd" may own the name,
  - everybody may read (Introspect, Properties.Get/GetAll, Peer),
  - root and members of the group "seglcd" may control (Properties.Set, SetSensor, ReloadConfig, SaveConfig).
  Add a user to the group: sudo usermod -aG seglcd <user>
-->
<busconfig>
  <policy user="seglcd">
    <allow own="io.github.fubar_coder.SegLcd1"/>
    <allow send_destination="io.github.fubar_coder.SegLcd1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.fubar_coder.SegLcd1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.fubar_coder.SegLcd1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.github.fubar_coder.SegLcd1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="io.github.fubar_coder.SegLcd1" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
  </policy>

  <policy group="seglcd">
    <allow send_destination="io.github.fubar_coder.SegLcd1"/>
  </policy>

  <policy user="root">
    <allow send_destination="io.github.fubar_coder.SegLcd1"/>
  </policy>
</busconfig>
