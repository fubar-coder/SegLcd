<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy for seglcdd (system service).
  - the service user "seglcd" may own the name,
  - everybody may call it; seglcdd itself asks polkit before a change (action io.github.fubar_coder.SegLcd1.control):
    the active local user may change settings, root and the group "seglcd" too, everybody else after admin
    authentication. Reading needs no authorization.
-->
<busconfig>
  <policy user="seglcd">
    <allow own="io.github.fubar_coder.SegLcd1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.fubar_coder.SegLcd1"/>
  </policy>
</busconfig>
