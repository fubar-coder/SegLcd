# seglcdd – configuration
# Location: $XDG_CONFIG_HOME/seglcd/config.toml (usually ~/.config/seglcd/config.toml), or: seglcdd --config <path>
# Format: TOML 1.1. This file contains ALL options with their default values – a missing file or
# missing keys behave the same.
#
# Sensor specs (section [sensors]):
#   ""                  automatic selection (default order in the comment)
#   "chip:label"        hwmon sensor, e.g. "k10temp:Tctl", "it8686_31050607:fan5"   (stable, preferred)
#   "hwmonN/name"       hwmon path, e.g. "hwmon5/fan1"                             (the number may change)
#   "a+b"               sum, e.g. "zenpower:SVI2_P_Core+zenpower:SVI2_P_SoC"
#   "rapl[:domain]"     RAPL power: package (default), core, uncore, dram, psys   (permissions: udev/72-rapl-energy-read.rules)
#   "nvml[N]:metric"    NVIDIA GPU N: temperature, power, clock, memclock, usage, fan (%)
#   "drm[N]:metric"     DRM card N: busy (%), freq (MHz, Intel)
# List the available sources: seglcd sensors

# Feed the display. false = send the off packet and release the device (e.g. for experiments with seglcd).
enabled = true

# Time between two packets in ms (50–400). The display turns off after about 400–500 ms without a packet.
update_interval_ms = 250

# Time between two sensor reads in ms (100–10000). In between, the last values are repeated.
sample_interval_ms = 1000

# Device path, only needed with several displays, e.g. "/dev/hidraw5". Empty = first segment LCD found.
device = ""

[sensors]
# CPU temperature.           Automatic: k10temp:Tctl, zenpower:Tdie, zenpower:Tctl, coretemp:Package id 0
cpu_temperature = ""

# CPU power (W).             Automatic: rapl, zenpower:SVI2_P_Core+zenpower:SVI2_P_SoC
cpu_power = ""

# CPU core voltage (V).      Automatic: zenpower:SVI2_Core
cpu_voltage = ""

# CPU clock from the values of all cores: "avg" (average), "max", "min", "first" (core 0).
cpu_clock_mode = "avg"

# GPU temperature.           Automatic: amdgpu:edge, nvml:temperature, xe:pkg
gpu_temperature = ""

# GPU usage (%).             Automatic: drm:busy, nvml:usage
gpu_usage = ""

# GPU power (W).             Automatic: amdgpu:PPT, nvml:power, rapl:uncore
gpu_power = ""

# GPU clock (MHz).           Automatic: amdgpu:sclk, nvml:clock, drm:freq
gpu_clock = ""

# Fan and pump speed (RPM). No automatic selection – the mainboard header depends on the system, e.g.:
#   fan = "it8686_31050607:fan1"
#   pump = "it8686_31050607:fan5"
fan = ""
pump = ""
